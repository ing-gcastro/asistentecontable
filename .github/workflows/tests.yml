# Corre los tests del núcleo en cada push / pull request (Windows, igual que producción).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Proyecto_facturas_v2/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r Proyecto_facturas_v2/requirements.txt
      - name: Tests
        run: python -W ignore -m unittest discover -s Proyecto_facturas_v2/tests -v
